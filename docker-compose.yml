services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: news-classifier:local
    container_name: news_classifier_api
    ports:
      - "8000:8000"
    volumes:
      # Mount local model artifacts without rebuilding the image
      - ./models:/app/models:ro
    env_file:
      - .env
    environment:
      LOG_FORMAT: "text"   # Human-readable logs for local dev
      DEBUG: "true"
      HF_HOME: "/tmp/huggingface"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/news/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: news_classifier_ngrok
    profiles:
      - ngrok
    restart: unless-stopped
    command:
      - "http"
      - "api:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      api:
        condition: service_healthy

volumes: {}

